<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seori Rewards 🌸</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background-color: #fff0f5; /* Tono rosa pastel muy suave */
            margin: 0; padding: 0; display: flex; flex-direction: column; 
            align-items: center; min-height: 100vh; color: #333;
        }
        
        .header { 
            width: 100%; background: #ffb6c1; padding: 20px; 
            text-align: center; color: white; font-weight: bold; font-size: 24px;
            border-bottom-left-radius: 25px; border-bottom-right-radius: 25px;
            box-shadow: 0 4px 10px rgba(255, 182, 193, 0.4);
        }

        .container { 
            width: 90%; max-width: 400px; margin-top: 30px; 
            background: white; border-radius: 20px; padding: 30px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center;
        }

        h2 { margin-top: 0; color: #ff6b81; font-size: 22px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }

        /* SECCIÓN LOGIN */
        #login-section { display: block; }
        .input-celular { 
            width: 100%; padding: 15px; border: 2px solid #ffe4e1; 
            border-radius: 12px; font-size: 18px; text-align: center;
            font-weight: bold; color: #333; outline: none; transition: 0.3s;
        }
        .input-celular:focus { border-color: #ffb6c1; }
        .btn-ingresar { 
            width: 100%; background: #ff6b81; color: white; border: none; 
            padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold;
            margin-top: 15px; cursor: pointer; transition: 0.3s;
        }
        .btn-ingresar:active { transform: scale(0.95); background: #ff4757; }

        /* SECCIÓN RECOMPENSAS (Oculta al inicio) */
        #rewards-section { display: none; }
        
        .sticker-card {
            background: #f8f9fa; border: 2px dashed #ffb6c1; 
            border-radius: 15px; padding: 20px; margin-top: 20px;
        }
        
        .grid-stickers { 
            display: grid; grid-template-columns: repeat(5, 1fr); 
            gap: 12px; margin-top: 15px;
        }

        .circulo-sticker {
            width: 100%; aspect-ratio: 1; border-radius: 50%;
            background: #eee; display: flex; justify-content: center; 
            align-items: center; font-size: 24px; transition: 0.5s;
        }
        
        .circulo-sticker.lleno { 
            background: #ffe4e1; animation: pop 0.3s ease-in-out; 
        }

        @keyframes pop {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .meta-texto { font-weight: bold; color: #ff6b81; margin-top: 15px; font-size: 15px;}
        
        .btn-volver { 
            background: transparent; color: #999; border: none; 
            margin-top: 20px; text-decoration: underline; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        🍧 Seori Rewards
    </div>

    <div class="container">
        <!-- PANTALLA 1: INGRESO -->
        <div id="login-section">
            <h2>¡Bienvenido! 🎎</h2>
            <p>Ingresa tu número de celular para ver cuántos stickers has acumulado en tus visitas.</p>
            <input type="tel" id="input-cel" class="input-celular" placeholder="Ej: 3001234567" maxlength="10">
            <button class="btn-ingresar" onclick="consultarStickers()" id="btn-login">Ver mi cartón</button>
        </div>

        <!-- PANTALLA 2: CARTÓN DE STICKERS -->
        <div id="rewards-section">
            <h2 id="saludo-cliente">¡Hola! 🌸</h2>
            <p>Por cada compra en caja, sumas un sticker. ¡Completa tu cartón y canjea premios!</p>
            
            <div class="sticker-card">
                <div style="font-weight: bold; color: #555;">Tu Cartón Virtual</div>
                <div class="grid-stickers" id="grid-stickers">
                    <!-- Los stickers se generan con Javascript -->
                </div>
                <div class="meta-texto" id="texto-progreso">Tienes 0 de 10 stickers</div>
            </div>

            <button class="btn-volver" onclick="salir()">Salir / Buscar otro número</button>
        </div>
    </div>

    <script>
        const META_STICKERS = 10; // Espacios totales en el cartón

        async function consultarStickers() {
            const celular = document.getElementById('input-cel').value.trim();
            if(celular.length < 10) return alert("Por favor ingresa un número válido de 10 dígitos.");

            const btn = document.getElementById('btn-login');
            btn.innerText = "Buscando..."; btn.disabled = true;

            try {
                // MODIFICA ESTA URL CON LA DE TU BACKEND EN RENDER
                const res = await fetch(`https://seori-backend.onrender.com/api/clientes/${celular}`);
                const data = await res.json();

                mostrarCarton(data.cantidad_stickers, data.nombre);
            } catch (error) {
                alert("Error al conectar con Seori. Intenta de nuevo.");
            } finally {
                btn.innerText = "Ver mi cartón"; btn.disabled = false;
            }
        }

        function mostrarCarton(cantidad, nombre) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('rewards-section').style.display = 'block';

            if(nombre) {
                document.getElementById('saludo-cliente').innerText = `¡Hola, ${nombre}! 🌸`;
            } else {
                document.getElementById('saludo-cliente').innerText = `¡Hola! 🌸`;
            }

            document.getElementById('texto-progreso').innerText = `Tienes ${cantidad} de ${META_STICKERS} stickers`;

            const grid = document.getElementById('grid-stickers');
            grid.innerHTML = '';

            // Dibujar los 10 circulitos
            for(let i = 1; i <= META_STICKERS; i++) {
                const circulo = document.createElement('div');
                circulo.className = 'circulo-sticker';
                
                // Si el número de sticker actual es menor o igual a la cantidad que tiene el cliente
                if(i <= cantidad) {
                    circulo.classList.add('lleno');
                    circulo.innerText = '🍧'; // Emoji de Bingsu cuando está lleno
                } else {
                    circulo.innerText = '⚪'; // Circulo gris vacío
                }
                
                grid.appendChild(circulo);
            }
        }

        function salir() {
            document.getElementById('input-cel').value = '';
            document.getElementById('rewards-section').style.display = 'none';
            document.getElementById('login-section').style.display = 'block';
        }
    </script>
</body>
</html>
